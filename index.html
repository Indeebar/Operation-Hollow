<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hollow Watch</title>
  <link rel="stylesheet" href="/src/ui/styles.css" />
</head>
<body>
  <div id="app">
    <canvas id="gameCanvas"></canvas>
    <div id="hud">
      <div id="crosshair">+</div>
      <div id="fps-counter">FPS: 0</div>
      <div id="quality-toggle" title="Click or press [K] to cycle Low / Medium / High">QUALITY: MED</div>

      <!-- F4 Debug Performance Panel -->
      <div id="debug-panel" style="display:none">
        <div class="dbg-header">
          <span>PERF DEBUG (F4)</span>
          <span id="dbg-fps-live">0 FPS</span>
        </div>
        <div class="dbg-row">
          <label><input type="checkbox" id="dbg-moon-shadow" /> Moon Shadows</label>
        </div>
        <div class="dbg-row">
          <label><input type="checkbox" id="dbg-torch-shadow" checked /> Flashlight Shadows</label>
        </div>
        <div class="dbg-row">
          <label><input type="checkbox" id="dbg-mist" checked /> Ground Mist (2 layers)</label>
        </div>
        <div class="dbg-row">
          <label><input type="checkbox" id="dbg-clutter" checked /> Grass / Rocks / Clutter</label>
        </div>
        <div class="dbg-row">
          <label><input type="checkbox" id="dbg-viewmodel-pass" checked /> Viewmodel 2nd Pass</label>
        </div>
        <div class="dbg-row">
          <span>Pixel Ratio:</span>
          <button class="dbg-btn" id="dbg-pr-10">1.0x</button>
          <button class="dbg-btn" id="dbg-pr-125">1.25x</button>
          <button class="dbg-btn" id="dbg-pr-15">1.5x</button>
        </div>
      </div>

      <!-- Tactical Status HUD -->
      <div id="status-hud">
        <div id="slot-status">
          <span class="hud-label">SLOT:</span>
          <span id="slot-display">[1] RIFLE</span>
        </div>
        <div id="flashlight-status">
          <span class="hud-label">LIGHT:</span>
          <span id="light-state">ON</span>
          <div class="battery-bar-container">
            <div id="battery-fill" style="width: 100%;"></div>
          </div>
          <span id="battery-pct">100%</span>
          <span id="battery-count">(x3)</span>
        </div>
        <div id="weapon-status">
          <span class="hud-label">AMMO:</span>
          <span id="ammo-display">20 / 40</span>
        </div>
      </div>

      <!-- Instruction / Hint bar -->
      <div id="info-bar">
        [1-3 / Wheel] Weapon Slot | [LMB] Fire | [RMB] Aim | [F] Torch | [F4] Perf Debug | [K] Quality
      </div>
      <div id="prompt-msg" style="display:none"></div>
    </div>
  </div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
