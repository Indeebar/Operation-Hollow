<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hollow Watch</title>
  <link rel="stylesheet" href="/src/ui/styles.css" />
</head>
<body>
  <div id="app">
    <canvas id="gameCanvas"></canvas>
    <div id="hud">
      <div id="crosshair">+</div>
      <div id="fps-counter">FPS: 0</div>
      <div id="quality-toggle" title="Click or press [K] to cycle Low / Medium / High">QUALITY: MED</div>

      <!-- Tactical Status HUD -->
      <div id="status-hud">
        <div id="slot-status">
          <span class="hud-label">SLOT:</span>
          <span id="slot-display">[1] RIFLE</span>
        </div>
        <div id="flashlight-status">
          <span class="hud-label">LIGHT:</span>
          <span id="light-state">ON</span>
          <div class="battery-bar-container">
            <div id="battery-fill" style="width: 100%;"></div>
          </div>
          <span id="battery-pct">100%</span>
          <span id="battery-count">(x3)</span>
        </div>
        <div id="weapon-status">
          <span class="hud-label">AMMO:</span>
          <span id="ammo-display">20 / 40</span>
        </div>
      </div>

      <!-- Instruction / Hint bar -->
      <div id="info-bar">
        [1-3 / Wheel] Weapon Slot | [LMB] Fire | [RMB] Aim | [R] Reload Gun / Swap Batt | [F] Torch | [K] Quality
      </div>
      <div id="prompt-msg" style="display:none"></div>
    </div>
  </div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
